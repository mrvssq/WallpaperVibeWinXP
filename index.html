<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XP · Infinite Clouds</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12338A}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
#hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);color:rgba(235,245,255,.7);font:12px system-ui,sans-serif;letter-spacing:.08em;pointer-events:none;transition:opacity 1.2s;text-align:center;white-space:nowrap}
@media(prefers-reduced-motion:reduce){#hint{transition:none}}
#controls{position:fixed;right:18px;top:18px;width:244px;padding:16px 18px;color:#eef5ff;background:rgba(10,25,66,.78);border:1px solid rgba(215,231,255,.22);border-radius:14px;box-shadow:0 8px 32px rgba(0,12,46,.22);backdrop-filter:blur(16px);font:13px system-ui,sans-serif;user-select:none}
#controls summary{cursor:pointer;font-weight:600;letter-spacing:.02em}
#controls label{display:block;margin-top:18px}
#controls .row{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
#controls output{color:#b8d3ff;font-variant-numeric:tabular-nums}
#controls input{display:block;width:100%;margin:0;accent-color:#aacfff;cursor:pointer}
#controls button{margin-top:18px;padding:7px 11px;background:rgba(215,231,255,.10);color:#eef5ff;border:1px solid rgba(215,231,255,.20);border-radius:7px;cursor:pointer;font:inherit}
#controls input:focus-visible,#controls button:focus-visible,#controls summary:focus-visible{outline:2px solid #d1e6ff;outline-offset:4px}
@media(max-width:420px){#controls{right:10px;top:10px;width:210px;padding:12px 14px}}
</style>
</head>
<body>
<canvas aria-label="Бесконечные облака с иконками Windows XP. Зажмите левую кнопку мыши и перетаскивайте полотно."></canvas>
<div id="hint">Перетаскивайте облака · Кликните по иконке, чтобы рассыпать её</div>
<details id="controls" open>
<summary>Настройки обоев</summary>
<label for="iconAmount"><span class="row"><span>Количество иконок</span><output id="iconAmountValue" for="iconAmount"></output></span><input id="iconAmount" type="range" min="0" max="1000" step="10" value="100"></label>
<label for="iconSize"><span class="row"><span>Средний размер иконок</span><output id="iconSizeValue" for="iconSize"></output></span><input id="iconSize" type="range" min="25" max="300" step="5" value="100"></label>
<label for="cloudGaps"><span class="row"><span>Просветы в облаках</span><output id="cloudGapsValue" for="cloudGaps"></output></span><input id="cloudGaps" type="range" min="0" max="100" step="1" value="0"></label>
<label for="cloudDensity"><span class="row"><span>Плотность облаков</span><output id="cloudDensityValue" for="cloudDensity"></output></span><input id="cloudDensity" type="range" min="0" max="200" step="1" value="100"></label>
<button id="resetSettings" type="button">Сбросить</button>
</details>
<script src="icons.js"></script>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const hint=document.querySelector('#hint');
const defaults={iconAmount:100,iconSize:100,cloudGaps:0,cloudDensity:100};
const settings={background:'#12338A',iconOpacity:1,chunkSize:760,...defaults};
try{
 const stored=JSON.parse(localStorage.getItem('xp-cloud-settings')||'{}');
 for(const [key,max] of [['iconAmount',1000],['iconSize',300],['cloudGaps',100],['cloudDensity',200]]){
  if(typeof stored[key]==='number'&&Number.isFinite(stored[key]))settings[key]=Math.max(key==='iconSize'?25:0,Math.min(max,stored[key]));
 }
}catch{}
const images=XP_ICONS.map(src=>{const img=new Image();img.src=src;return img});
let width=innerWidth,height=innerHeight,dpr=1,camera={x:0,y:0},drag=null,frame=0,dirty=true;
let velocity={x:0,y:0},previousTime=0;
const vanished=new Set(),bursts=[];
function rememberVanished(id){
 vanished.add(id);
 if(vanished.size>4096)vanished.delete(vanished.values().next().value);
}
function iconDimensions(icon,image){
 const ratio=image.naturalWidth/image.naturalHeight;
 return {w:ratio>=1?icon.size:icon.size*ratio,h:ratio>=1?icon.size/ratio:icon.size};
}
function popIcon(px,py){
 // Reverse the drawing order so the icon on top receives the click.
 for(let li=layers.length-1;li>=0;li--){
  const layer=layers[li],chunks=[...layer.chunks.values()];
  for(let ci=chunks.length-1;ci>=0;ci--)for(let ii=chunks[ci].icons.length-1;ii>=0;ii--){
   const icon=chunks[ci].icons[ii],image=images[icon.image];
   if(vanished.has(icon.id)||!image.complete||!image.naturalWidth)continue;
   const x=icon.x-camera.x*layer.depth+width/2,y=icon.y-camera.y*layer.depth+height/2;
   const dx=px-x,dy=py-y,cos=Math.cos(icon.angle),sin=Math.sin(icon.angle);
   const lx=dx*cos+dy*sin,ly=-dx*sin+dy*cos,{w,h}=iconDimensions(icon,image);
   if(Math.abs(lx)>w/2||Math.abs(ly)>h/2)continue;
   rememberVanished(icon.id);
   const tiles=[],cols=Math.max(5,Math.min(16,Math.round(w/4))),rows=Math.max(5,Math.min(16,Math.round(h/4)));
   const rng=random(hash(Math.floor(icon.x),Math.floor(icon.y),layer.index+303));
   for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const tx=(col+.5)*w/cols-w/2,ty=(row+.5)*h/rows-h/2;
    const ox=tx*cos-ty*sin,oy=tx*sin+ty*cos;
    tiles.push({col,row,ox,oy,vx:ox*1.7+(rng()-.5)*70,vy:oy*1.3-35-rng()*60,delay:rng()*.12});
   }
   bursts.push({icon,image,depth:layer.depth,w,h,cols,rows,tiles,age:0,duration:reduced?.20:.85});
   if(bursts.length>24)bursts.shift();
   dirty=true;return true;
  }
 }
 return false;
}
function drawBursts(){
 ctx.imageSmoothingEnabled=false;
 for(const burst of bursts){
  const {icon,image,depth,w,h,cols,rows,age,duration}=burst;
  const cx=icon.x-camera.x*depth+width/2,cy=icon.y-camera.y*depth+height/2;
  for(const tile of burst.tiles){
   const t=Math.max(0,age-tile.delay),progress=Math.min(1,t/(duration-tile.delay));
   if(progress>=1)continue;
   // Discrete square fragments retain the actual colors of the XP icon.
   const travel=reduced?0:t;
   const x=cx+tile.ox+tile.vx*travel,y=cy+tile.oy+tile.vy*travel+95*travel*travel;
   const scale=1-Math.floor(progress*5)/5;
   ctx.globalAlpha=settings.iconOpacity*(1-Math.floor(progress*4)/4);
   ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(icon.angle);
   ctx.drawImage(image,tile.col*image.naturalWidth/cols,tile.row*image.naturalHeight/rows,
    image.naturalWidth/cols,image.naturalHeight/rows,-w/cols*scale/2,-h/rows*scale/2,w/cols*scale,h/rows*scale);
   ctx.restore();
  }
 }
 ctx.imageSmoothingEnabled=true;ctx.globalAlpha=1;
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const layers=[
 {depth:.32,size:.44,cloudAlpha:.36,icons:5},
 {depth:.56,size:.70,cloudAlpha:.55,icons:4},
 {depth:.80,size:1.04,cloudAlpha:.74,icons:3},
 {depth:1.12,size:1.50,cloudAlpha:.87,icons:2}
].map((p,i)=>({...p,index:i,chunks:new Map()}));
function hash(x,y,z){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z+7,1274126177);h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0}
function random(seed){return()=>{seed+=0x6D2B79F5;let t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
/* Shared soft volumetric cloud sprites: all chunks reuse these bitmaps. */
const clouds=Array.from({length:12},(_,index)=>{
 const c=document.createElement('canvas');c.width=640;c.height=420;
 const g=c.getContext('2d'),r=random(hash(index,42,9));
 // Broad blue shadow merges into the sky instead of leaving hard edges.
 for(let j=0;j<44;j++){
  const x=95+r()*450,y=135+r()*160,rad=38+r()*90;
  const gradient=g.createRadialGradient(x-rad*.16,y-rad*.3,0,x,y,rad);
  gradient.addColorStop(0,'rgba(242,249,255,.19)');
  gradient.addColorStop(.35,'rgba(221,236,255,.15)');
  gradient.addColorStop(.68,'rgba(158,189,235,.07)');
  gradient.addColorStop(1,'rgba(118,154,221,0)');
  g.fillStyle=gradient;g.fillRect(x-rad,y-rad,rad*2,rad*2);
 }
 for(let j=0;j<19;j++){
  const x=135+r()*370,y=110+r()*150,rad=32+r()*58;
  const gradient=g.createRadialGradient(x-rad*.15,y-rad*.23,2,x,y,rad);
  gradient.addColorStop(0,'rgba(255,254,248,.30)');
  gradient.addColorStop(.30,'rgba(245,250,255,.25)');
  gradient.addColorStop(.65,'rgba(218,234,255,.10)');
  gradient.addColorStop(1,'rgba(198,220,255,0)');
  g.fillStyle=gradient;g.fillRect(x-rad,y-rad,rad*2,rad*2);
 }
 return c;
});
function getChunk(layer,x,y){
 const key=x+','+y;
 if(layer.chunks.has(key))return layer.chunks.get(key);
  const r=random(hash(x,y,layer.index)),s=settings.chunkSize,cloud=[],icons=[];
 const cloudRandom=random(hash(x,y,layer.index+101));
  for(let i=0;i<8;i++){
  const item={x:(x+r())*s,y:(y+r())*s,w:(380+r()*480)*layer.size,sprite:Math.floor(r()*clouds.length),alpha:.55+r()*.45};
  // Keep cloud positions deterministic while removing banks and shrinking
  // their footprint as gaps increase. At zero the original sky is exact.
  const gap=settings.cloudGaps/100;
  if(cloudRandom()>=gap){item.w*=1-gap*.55;cloud.push(item)}
 }
  const target=layer.icons*settings.iconAmount/100;
 const count=Math.floor(target)+(random(hash(x,y,layer.index+202))()<target%1?1:0);
 for(let i=0;i<count;i++)icons.push({id:layer.index+":"+x+":"+y+":"+i,x:(x+.10+r()*.8)*s,y:(y+.10+r()*.8)*s,size:(45+r()*30)*layer.size*settings.iconSize/100,image:Math.floor(r()*images.length),angle:(r()-.5)*.24});
 const chunk={x,y,cloud,icons};layer.chunks.set(key,chunk);return chunk;
}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);dirty=true}
addEventListener('resize',resize);resize();
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle=settings.background;ctx.fillRect(0,0,width,height);
 for(const layer of layers){
  const offsetX=camera.x*layer.depth,offsetY=camera.y*layer.depth,s=settings.chunkSize;
  const margin=800*layer.size;
  const minX=Math.floor((offsetX-width/2-margin)/s),maxX=Math.floor((offsetX+width/2+margin)/s);
  const minY=Math.floor((offsetY-height/2-margin)/s),maxY=Math.floor((offsetY+height/2+margin)/s);
  const visible=[];
  for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++)visible.push(getChunk(layer,x,y));
  for(const [key,chunk]of layer.chunks)if(chunk.x<minX||chunk.x>maxX||chunk.y<minY||chunk.y>maxY)layer.chunks.delete(key);
  for(const chunk of visible)for(const cloud of chunk.cloud){
   const x=cloud.x-offsetX+width/2,y=cloud.y-offsetY+height/2,w=cloud.w,h=w*420/640;
   if(x+w/2<0||x-w/2>width||y+h/2<0||y-h/2>height)continue;
   ctx.globalAlpha=Math.min(1,layer.cloudAlpha*cloud.alpha*settings.cloudDensity/100);ctx.drawImage(clouds[cloud.sprite],x-w/2,y-h/2,w,h);
  }
 }
 // Every icon has exactly the same opacity, regardless of depth.
 ctx.globalAlpha=settings.iconOpacity;
 for(const layer of layers)for(const chunk of layer.chunks.values())for(const icon of chunk.icons){
  const image=images[icon.image];if(vanished.has(icon.id)||!image.complete||!image.naturalWidth)continue;
  const x=icon.x-camera.x*layer.depth+width/2,y=icon.y-camera.y*layer.depth+height/2,s=icon.size;
  if(x+s<0||x-s>width||y+s<0||y-s>height)continue;
  ctx.save();ctx.translate(x,y);ctx.rotate(icon.angle);
  const ratio=image.naturalWidth/image.naturalHeight;
  const w=ratio>=1?s:s*ratio,h=ratio>=1?s/ratio:s;
  ctx.drawImage(image,-w/2,-h/2,w,h);ctx.restore();
 }
 ctx.globalAlpha=1;
 drawBursts();
}
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;
 canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,id:e.pointerId,moved:false,started:performance.now()};
 velocity.x=velocity.y=0;canvas.classList.add('dragging');hint.style.opacity=0;
});
canvas.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved){
  if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<5)return;
  drag.moved=true;
 }
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 camera.x-=dx;camera.y-=dy;velocity.x=-dx;velocity.y=-dy;
 drag.x=e.clientX;drag.y=e.clientY;dirty=true;
});
function release(e){
 if(!drag||drag.id!==e.pointerId)return;
 const click=e.type==='pointerup'&&!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<5&&performance.now()-drag.started<500;
 drag=null;canvas.classList.remove('dragging');
 if(click){velocity.x=velocity.y=0;popIcon(e.clientX,e.clientY)}
 if(reduced)velocity.x=velocity.y=0;
 dirty=true;
}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('lostpointercapture',release);
addEventListener('blur',()=>{drag=null;velocity.x=velocity.y=0;canvas.classList.remove('dragging')});
images.forEach(image=>image.addEventListener('load',()=>dirty=true));
function animate(time){
 const dt=Math.min((time-previousTime)/16.667,2);previousTime=time;
 if(!drag&&(Math.abs(velocity.x)>.02||Math.abs(velocity.y)>.02)){
  const decay=Math.pow(.90,dt);velocity.x*=decay;velocity.y*=decay;camera.x+=velocity.x*dt;camera.y+=velocity.y*dt;dirty=true;
 }
  if(bursts.length){
  for(let i=bursts.length-1;i>=0;i--){bursts[i].age+=dt/60;if(bursts[i].age>=bursts[i].duration)bursts.splice(i,1)}
  dirty=true;
 }
 if(dirty){draw();dirty=false}
 frame=requestAnimationFrame(animate);
}
function updateControls(){
 for(const key of Object.keys(defaults)){
  document.getElementById(key).value=settings[key];
  document.getElementById(key+'Value').value=settings[key]+'%';
 }
}
function applySettings(rebuild){
 if(rebuild)for(const layer of layers)layer.chunks.clear();
 dirty=true;
 try{localStorage.setItem('xp-cloud-settings',JSON.stringify({iconAmount:settings.iconAmount,iconSize:settings.iconSize,cloudGaps:settings.cloudGaps,cloudDensity:settings.cloudDensity}))}catch{}
 updateControls();
}
for(const key of Object.keys(defaults)){
 document.getElementById(key).addEventListener('input',e=>{
  settings[key]=Number(e.target.value);applySettings(key!=='cloudDensity');
 });
}
document.getElementById('resetSettings').addEventListener('click',()=>{Object.assign(settings,defaults);vanished.clear();bursts.length=0;applySettings(true)});
updateControls();
requestAnimationFrame(animate);
setTimeout(()=>hint.style.opacity=0,12000);
window.wallpaperDebug={camera,layers,settings,get cachedChunks(){return layers.reduce((n,l)=>n+l.chunks.size,0)}};
</script>
</body>
</html>
